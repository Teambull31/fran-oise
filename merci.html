<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Merci — Couture &amp; Fil</title>
    <meta name="robots" content="noindex" />
    <!-- Le .ico de la racine est ce que Google et la plupart des robots
         demandent en premier ; les deux autres servent aux navigateurs. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/assets/img/logo.png" type="image/png" sizes="192x192" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
      .merci {
        min-height: 70vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem 1rem;
      }

      .merci-carte {
        max-width: 32rem;
      }

      .merci-carte h1 {
        margin-bottom: 0.75rem;
      }
    </style>
  </head>

  <body>
    <div class="merci">
      <div class="merci-carte">
        <p class="eyebrow">Couture &amp; Fil</p>
        <h1>Merci !</h1>
        <p>
          Votre paiement a été transmis à SumUp. Vous recevrez une confirmation directement de
          leur part ; si quelque chose semble ne pas s’être bien passé, contactez-moi et nous
          réglerons ça ensemble.
        </p>
        <p><a class="btn btn--primary" href="index.html">Retour au site</a></p>
      </div>
    </div>

    <script>
      // On n'arrive ici qu'au retour de SumUp, le paiement passé : le
      // panier a fait son office. Sans cet effacement, la cliente
      // retrouvait au retour les articles qu'elle venait de régler —
      // de quoi croire que la commande n'était pas partie, et la payer
      // une seconde fois. Même clé que assets/js/app.js.
      try {
        localStorage.removeItem('couture-fil:cart');
      } catch (erreur) {
        /* mode privé : le panier disparaîtra de toute façon */
      }
    </script>
  </body>
</html>
